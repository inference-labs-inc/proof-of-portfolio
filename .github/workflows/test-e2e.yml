name: Test E2E Workflow

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test-installation:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
        python-version: ['3.10']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install package
      shell: bash
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -e .

    - name: Clone PTN repository
      uses: actions/checkout@v4
      with:
        repository: taoshidev/proprietary-trading-network
        path: proprietary-trading-network

    - name: Test end-to-end proof generation and verification
      shell: bash
      run: |
        source .venv/bin/activate
        python .github/workflows/test_prove.py

    - name: Test CLI functionality
      shell: bash
      run: |
        source .venv/bin/activate
        pop --version
        pop generate-test-data --num-miners 2 --output-file test_generated.json

        if [ -f test_generated.json ]; then
          echo "✓ Test data generation successful"
          head -5 test_generated.json
        else
          echo "✗ Test data generation failed"
          exit 1
        fi
